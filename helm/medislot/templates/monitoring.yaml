{{- $sm := .Values.monitoring.serviceMonitor -}}
{{- /* Only render the ServiceMonitor when the Prometheus Operator CRDs exist, so the chart also installs on bare clusters. */ -}}
{{- if and $sm.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/ServiceMonitor") }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "medislot.backendName" . }}
  labels:
    {{- include "medislot.componentLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
    {{- with $sm.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "medislot.selectorLabels" (dict "ctx" . "component" "backend") | nindent 6 }}
  namespaceSelector:
    matchNames: [{{ .Release.Namespace }}]
  endpoints:
    - port: http
      path: /metrics
      interval: {{ $sm.interval }}
{{- end }}
{{- if .Values.monitoring.grafanaDashboard.enabled }}
---
# Picked up automatically by the Grafana sidecar of kube-prometheus-stack (label grafana_dashboard=1).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "medislot.fullname" . }}-grafana-dashboard
  labels:
    {{- include "medislot.labels" . | nindent 4 }}
    grafana_dashboard: "1"
  annotations:
    grafana_folder: MediSlot
data:
  medislot.json: |-
    {{- .Files.Get "dashboards/medislot.json" | nindent 4 }}
{{- end }}
