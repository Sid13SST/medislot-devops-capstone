{{- $password := include "medislot.postgresPassword" . -}}
{{- $auth := .Values.postgres.auth -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "medislot.dbSecretName" . }}
  labels:
    {{- include "medislot.componentLabels" (dict "ctx" . "component" "database") | nindent 4 }}
type: Opaque
stringData:
  postgres-user: {{ $auth.username | quote }}
  postgres-password: {{ $password | quote }}
  postgres-database: {{ $auth.database | quote }}
  database-url: {{ printf "postgresql+psycopg://%s:%s@%s:5432/%s" $auth.username $password (include "medislot.postgresName" .) $auth.database | quote }}
