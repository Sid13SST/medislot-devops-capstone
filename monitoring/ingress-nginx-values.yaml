# Values for ingress-nginx/ingress-nginx on AWS EKS.
#   helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx --version 4.15.1 \
#     -n ingress-nginx --create-namespace -f monitoring/ingress-nginx-values.yaml
#
# Note: the community ingress-nginx project reached end of maintenance in 2026. It is used here
# because the course's Ingress lab is built around it; for long-lived production clusters prefer a
# maintained controller (e.g. Traefik or the AWS Load Balancer Controller) — the chart only needs
# `ingress.className` changed.
controller:
  replicaCount: 1
  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
  # Expose controller metrics to Prometheus too (requests per ingress, upstream latency).
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
  resources:
    requests: {cpu: 50m, memory: 96Mi}
