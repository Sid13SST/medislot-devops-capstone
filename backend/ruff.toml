line-length = 120
target-version = "py312"
extend-exclude = ["alembic/script.py.mako"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
# B008: FastAPI's Depends()/Query() in defaults is the framework's documented pattern.
ignore = ["B008"]

[lint.per-file-ignores]
"tests/*" = ["S101"]

[lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]
